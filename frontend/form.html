<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caption — Generator Caption Produk</title>
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/form.css">
</head>
<body>

  <nav>
    <a href="index.html">Etalase</a>
    <a href="form.html" aria-current="page">Caption</a>
  </nav>

  <header>
    <div class="eyebrow">Rak No. 05 — Meja Kasir</div>
    <h1>Caption</h1>
    <p>isi nama produk &amp; harga, pilih template, caption jadi</p>
  </header>

  <main>
    <form id="form" novalidate>
      <label for="nama">Nama Produk</label>
      <input type="text" id="nama" placeholder="contoh: Sourdough" aria-describedby="nama-error">
      <small class="error" id="nama-error" aria-live="polite"></small>

      <label for="harga">Harga</label>
      <input type="number" id="harga" placeholder="contoh: 100.000" aria-describedby="harga-error">
      <small class="error" id="harga-error" aria-live="polite"></small>

      <label for="template">Template</label>
      <select id="template">
        <option value="promo">Promo</option>
        <option value="santai">Santai</option>
        <option value="formal">Formal</option>
      </select>

      <button type="submit">Buat Caption</button>

      <label for="caption">Hasil Caption</label>
      <textarea id="caption" rows="14" readonly></textarea>
    </form>
  </main>

  <footer>
    caption generator &middot; dibuat dengan HTML + JS native
  </footer>

<script src="backend/emyuvscomo.js"></script>
</body>
</html>
