<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Roti - Etalase & Caption Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">🥐 Toko Roti Fresh</div>
    <nav class="nav">
      <button id="btn-etalase" class="nav-btn active">Etalase Roti</button>
      <button id="btn-caption" class="nav-btn">Form Caption</button>
    </nav>
  </header>

  <main class="container">
    <!-- HALAMAN ETALASE -->
    <section id="page-etalase" class="page active">
      <div class="section-title">
        <h2>Katalog Roti Fresh Bake</h2>
        <p>Klik salah satu produk di bawah untuk membuatkan caption-nya secara otomatis!</p>
      </div>
      <div id="product-grid" class="product-grid">
        <!-- Produk akan dimuat lewat JavaScript -->
      </div>
    </section>

    <!-- HALAMAN CAPTION GENERATOR -->
    <section id="page-caption" class="page">
      <div class="card">
        <h2>Form Caption Generator</h2>
        <form id="form" novalidate>
          <div class="form-group">
            <label for="nama">Nama Produk Roti</label>
            <input type="text" id="nama" placeholder="Contoh: Croissant Butter" autocomplete="off">
            <div id="nama-error" class="error-msg"></div>
          </div>

          <div class="form-group">
            <label for="harga">Harga (Rupiah)</label>
            <input type="number" id="harga" placeholder="Contoh: 25000">
            <div id="harga-error" class="error-msg"></div>
          </div>

          <div class="form-group">
            <label for="template">Gaya Caption</label>
            <select id="template">
              <option value="promo">🔥 Promo Spesial</option>
              <option value="santai">✨ Santai & Kasual</option>
              <option value="formal">✦ Formal & Elegan</option>
              <option value="fresh_bake">🥖 Fresh From Oven</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">Generate Caption</button>
        </form>

        <div class="caption-result">
          <label for="caption">Hasil Caption</label>
          <textarea id="caption" readonly rows="8" placeholder="Hasil caption akan muncul di sini..."></textarea>
          <button id="copy-btn" class="btn-secondary">📋 Salin Caption</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
